# -----------------------------------------------------------------------------
# GROUPES SÉMANTIQUES COMPATIBLES
# Si le code CNIG et le libellé saisi relèvent de groupes compatibles, ce n'est
# pas un conflit : on garde l'interprétation du code (fiabilité haute).
# Ex. code 02-01 (inconstructible pour risques) + libellé "zone inondable".
# -----------------------------------------------------------------------------
groupes_compatibles:
  - [protection_reglementaire, risque]
  - [protection_reglementaire, ecologique]
  - [protection_reglementaire, protection_forte]
  - [protection_reglementaire, protection_agricole]
  - [protection_forte, ecologique]
  - [boisement_protege, ecologique]
  - [boisement_protege, protection_forte]
  - [patrimoine, ecologique]
  - [patrimoine, boisement_protege]
  - [projet_public, projet_hydraulique]
  - [projet_public, projet_urbain]
  - [projet_public, projet_amenagement]
  - [projet_urbain, projet_amenagement]
  - [projet_urbain, urbain]
  - [preemption, preemption_naturelle]
  - [risque, nuisance]
  - [ressource_eau, ecologique]
  - [constructibilite_AN, urbain]
