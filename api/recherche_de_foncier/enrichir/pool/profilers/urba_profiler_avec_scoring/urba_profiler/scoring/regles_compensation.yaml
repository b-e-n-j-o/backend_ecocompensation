# =============================================================================
# Règles de scoring urbanistique — vocation : COMPENSATION ÉCOLOGIQUE
# =============================================================================
# Statut : PROPOSITION v0.1 — à relire, attester ou modifier par un urbaniste.
# Ce fichier EST la logique métier : le moteur (engine.py) ne contient aucune
# valeur métier en dur. La documentation REGLES_SCORING.md est générée depuis
# ce fichier (python -m urba_profiler.scoring.doc).
#
# Lecture d'une règle :
#   id            identifiant stable (ne pas renommer : référencé dans les résultats)
#   familles      couches concernées : prescription | information | servitude
#   codes         codes CNIG "TT-SS" (prescription/information). "TT-*" = tous sous-types
#   suptypes      catégories SUP (servitude), en minuscules ("ac1", "pm1"...)
#   suptypes_prefixe  repli sur le préfixe de catégorie ("el", "pt"...)
#   mots_cles     regex "fortes" cherchées dans le libellé saisi (texte normalisé :
#                 [portée : pour une règle prescription OU information, les mots-clés
#                  s'appliquent aux deux familles, car le GPU contient des objets
#                  versés dans la mauvaise couche ; les codes, eux, restent par famille]
#                 minuscules, sans accents). Servent (1) à interpréter les codes
#                 99/absents/hors nomenclature, (2) à détecter un code mal saisi.
#   raffine + mots_cles_raffinement : affine une règle générique (ex. ER "05-00"
#                 dont le libellé dit "élargissement de voie" -> ER voirie)
#   generique     true = règle "fourre-tout" (05-00, 18-00, 99-xx) qu'un libellé
#                 explicite peut remplacer sans que ce soit un conflit
#   groupe        famille sémantique ; deux règles du même groupe ne sont pas
#                 en conflit (ex. code TVB + libellé "haies" = cohérent)
#   effets        points par sous-score pour une couverture totale (facteur 1)
#                 et une fiabilité haute : perennite | compatibilite | synergie |
#                 maitrise | confiance
#   profils       surcharge des effets selon le type de mesure compensatoire
#   portee        surface (défaut : proportionnel au % couvert) | presence (facteur 1)
#   veto          [{seuil_pct, niveau: bloquant|majeur, profils?, motif}]
#   point_a_verifier  message affiché quand la règle est déclenchée
#   a_confirmer   true = interprétation incertaine, question posée à l'expert
# =============================================================================

version: "0.1.0"
statut: "proposition — à valider par un urbaniste"

profils:
  generique: "Mesure non précisée (lecture prudente)"
  zones_humides: "Restauration / création de zones humides, mares, reméandrage"
  boisement: "Boisement, reboisement, plantation de haies, îlots de sénescence"
  milieux_ouverts: "Pelouses, prairies, landes : réouverture, gestion extensive"

sous_scores:
  perennite: "Risque qu'un usage concurrent (urbanisation, équipement, énergie, extraction) remette en cause la mesure sur 30 ans et plus"
  compatibilite: "Compatibilité réglementaire des travaux et de la gestion écologique (défrichement, affouillements, plantations, servitudes techniques)"
  synergie: "Alignement avec les politiques locales de biodiversité (TVB, renaturation, PAEN...) ; diminuée par les risques d'additionnalité (site déjà protégé)"
  maitrise: "Contraintes réglementaires sur l'acquisition ou la maîtrise d'usage (préemption, bénéficiaire public, propriété publique)"

ponderation_globale:
  perennite: 0.45
  compatibilite: 0.30
  synergie: 0.15
  maitrise: 0.10

base:  # valeur de départ des sous-scores hors pérennité (pérennité = base du zonage)
  compatibilite: 80
  synergie: 50
  maitrise: 80

fiabilite:
  multiplicateur: {haute: 1.0, moyenne: 0.8, basse: 0.6}
  # Un veto déclenché par un signal de fiabilité basse n'est pas appliqué :
  # il est rétrogradé en point à vérifier (on ne bloque pas sur une donnée douteuse).
  veto_si_fiabilite_basse: false

facteurs:
  surface_min: 0.10          # plancher : un élément surfacique retenu pèse au moins 10 %
  lineaire_min: 0.20         # facteur linéaire = longueur / racine(surface), borné [min, 1]
  ponctuel_interieur: 0.30
  ponctuel_limite: 0.15
  multiplicateur_limite: 0.5 # linéaires / ponctuels en limite de parcelle

plafonds_veto:
  bloquant: 15
  majeur: 40

classes:
  - {min: 75, code: A, libelle: "Très favorable"}
  - {min: 60, code: B, libelle: "Favorable"}
  - {min: 45, code: C, libelle: "Mitigé — à étudier"}
  - {min: 30, code: D, libelle: "Défavorable"}
  - {min: 0,  code: E, libelle: "Très défavorable / bloquant"}

confiance:
  depart: 100
  penalites:
    aucun_zonage_gpu: 30
    zonage_couverture_anormale: 10     # somme des % de zonage hors [90 ; 110]
    zonage_conflit_type: 8             # typezone incohérent avec le libellé
    couche_en_erreur: 10
    couche_en_erreur_max: 30
    element_conflit: 4
    element_conflit_max: 20
    element_fiabilite_basse: 3
    element_fiabilite_basse_max: 15
    element_non_interprete: 2
    element_non_interprete_max: 10
    document_pos: 25
    document_ancien_15ans: 10
  niveaux: {haute: 75, moyenne: 50}

# -----------------------------------------------------------------------------
# ZONAGE
# -----------------------------------------------------------------------------
zonage:
  # Base de PÉRENNITÉ par type de zone, pondérée par le % de parcelle couvert.
  # Le reste non couvert (trous de données) prend la valeur "inconnu".
  base_perennite:
    N:
      valeur: 85
      justification: "Zone naturelle et forestière : inconstructible par principe (R151-24/25), exceptions encadrées (L151-11 à 13). Vocation la plus cohérente avec une mesure pérenne ; le risque résiduel est un reclassement lors d'une révision."
    A:
      valeur: 72
      justification: "Zone agricole : inconstructible sauf constructions et installations agricoles, extensions/annexes, STECAL, équipements collectifs, et désormais agrivoltaïsme (loi APER 2023). Pérennité bonne mais concurrence d'usages agricoles et énergétiques."
    Nh:
      valeur: 50
      justification: "Ancien secteur naturel de constructibilité limitée (habitat diffus) : constructions déjà admises."
    Ah:
      valeur: 45
      justification: "Ancien secteur agricole de constructibilité limitée (habitat diffus)."
    AUs:
      valeur: 25
      justification: "Urbanisation future, ouverture par modification/révision. Incompatible avec un engagement de 30 ans, sauf zone 2AU ancienne : depuis la loi Climat et résilience, une zone AU non ouverte dans les 6 ans ne peut l'être que par révision (L153-31), ce qui la rend moins menaçante."
      point_a_verifier: "Zone AU stricte : vérifier sa date de création (une 2AU ancienne de plus de 6 ans exige une révision pour être ouverte) et la volonté communale."
    AUc:
      valeur: 8
      justification: "Zone à urbaniser ouverte : urbanisation à court terme."
    U:
      valeur: 5
      justification: "Zone urbaine constructible. Seule exception : désartificialisation / renaturation de friches (non couverte par ce profil)."
    CC_01:
      valeur: 10
      justification: "Carte communale — secteur ouvert à la construction."
    CC_02:
      valeur: 10
      justification: "Carte communale — secteur réservé aux activités."
    CC_03:
      valeur: 75
      justification: "Carte communale — secteur non ouvert à la construction (sauf exceptions de L161-4) : équivalent A/N."
    CC_99:
      valeur: 50
      justification: "Carte communale — secteur 'autre' non qualifié."
    RNU:
      valeur: 60
      justification: "Aucun zonage au GPU : commune au RNU (constructibilité limitée hors parties actuellement urbanisées, L111-3) ou document non versé. Pérennité moyenne, fiabilité faible."
      point_a_verifier: "Aucun zonage GPU : vérifier si la commune est au RNU ou si son document n'est pas versé au GPU (consulter la mairie)."
    inconnu:
      valeur: 50
      justification: "Type de zone non déterminable."

  veto:
    - {types: [U], seuil_pct: 50, niveau: bloquant, motif: "Parcelle majoritairement en zone urbaine constructible."}
    - {types: [AUc], seuil_pct: 30, niveau: bloquant, motif: "Zone à urbaniser ouverte sur une part significative de la parcelle."}
    - {types: [AUs], seuil_pct: 50, niveau: majeur, motif: "Parcelle majoritairement en zone d'urbanisation future."}
    - {types: [CC_01, CC_02], seuil_pct: 50, niveau: bloquant, motif: "Secteur constructible de carte communale."}

  # Destinations v2024 (DESTOUI) : en zone A/N, une destination habitat ou
  # activité autorisée affaiblit la pérennité.
  destinations:
    habitat: {prefixes: ["2"], perennite: -5, types: [A, N]}
    activites: {prefixes: ["3", "5"], perennite: -8, types: [A, N]}

  # Sous-secteurs : déclenchés par le libellé court (regex sur le libellé brut,
  # insensible à la casse) ET/OU des mots-clés du libellé long. Les conventions de
  # suffixes varient d'une commune à l'autre : un libellé court seul donne une
  # fiabilité "moyenne", confirmé par le libellé long une fiabilité "haute".
  secteurs:
    - id: sect_zone_humide
      label: "Sous-secteur zone humide"
      types: [A, N]
      libelle_regex: '^[AN][a-z0-9]*zh'
      mots_cles: ['zones? humides?', 'milieux? humides?', 'marais', 'tourbiere']
      effets: {perennite: 8, synergie: 10}
      profils: {zones_humides: {perennite: 8, synergie: 15}}
      point_a_verifier: "Secteur zone humide : si la ZH est déjà fonctionnelle et protégée, la préserver n'apporte pas de gain écologique (additionnalité). Intérêt si elle est dégradée et restaurable."
      justification: "Zonage dédié aux zones humides : protection renforcée (pérennité) et cohérence directe avec une compensation ZH."
    - id: sect_naturel_protege
      label: "Sous-secteur naturel protégé / remarquable"
      types: [N]
      libelle_regex: '^N(p|pr|r|rem|s|sp)\d*$'
      mots_cles: ['protection (stricte|renforcee)', 'natura ?2000', '\bznieff\b', 'reservoirs? de biodiversite', 'espaces? naturels? sensibles?']
      effets: {perennite: 8, synergie: 3}
      point_a_verifier: "Secteur naturel protégé : vérifier l'additionnalité (milieu déjà protégé et peut-être déjà en bon état)."
      justification: "Protection renforcée du milieu naturel. Bonne pérennité, synergie limitée par le risque d'additionnalité."
      a_confirmer: true
      question_expert: "Les suffixes Np/Nr/Ns sont-ils suffisamment homogènes pour être interprétés sans le libellé long ?"
    - id: sect_corridor
      label: "Sous-secteur corridor / continuité écologique"
      types: [A, N]
      libelle_regex: '^[AN](co|tvb|ce|eco)\d*$'
      mots_cles: ['corridor', 'continuite', 'trame (verte|bleue)', '\btvb\b']
      effets: {perennite: 5, synergie: 15}
      justification: "Le document identifie le secteur comme continuité écologique : forte cohérence avec une mesure compensatoire (argument pour l'instructeur)."
    - id: sect_forestier
      label: "Sous-secteur forestier"
      types: [N]
      libelle_regex: '^Nf\d*$'
      mots_cles: ['secteur forestier', 'exploitation forestiere', 'sylvicole', 'vocation forestiere', 'massifs? boises?']
      effets: {perennite: 5}
      profils:
        boisement: {perennite: 5, synergie: 5}
        zones_humides: {perennite: 5, compatibilite: -5}
        milieux_ouverts: {perennite: 5, compatibilite: -8}
      point_a_verifier: "Secteur forestier : une réouverture de milieu suppose une autorisation de défrichement (code forestier L341-3), indépendante du PLU."
      justification: "Vocation forestière confirmée. Favorable au boisement, défavorable à la réouverture."
    - id: sect_loisirs
      label: "Sous-secteur loisirs / tourisme / sport"
      types: [A, N]
      libelle_regex: '^N(l|t|tl|lt|s?l|g|golf|camp|c?amp)\d*$'
      mots_cles: ['loisirs?', 'touristiques?', 'camping', '\bgolf\b', 'sporti', 'hebergements? touristiques?', 'parc de loisirs', 'equestre', 'aire de jeux']
      effets: {perennite: -20}
      justification: "Aménagements de loisirs et d'hébergement admis : concurrence d'usage et fréquentation."
    - id: sect_equipements
      label: "Sous-secteur équipements / services publics"
      types: [A, N]
      libelle_regex: '^[AN](e|eq|sp|step|ep|gv)\d*$'
      mots_cles: ['equipements? (publics?|collectifs?|d.interet)', "station d.epuration", 'services? publics?', 'gens du voyage', "aire d.accueil", 'cimetiere']
      effets: {perennite: -20}
      justification: "Secteur destiné à recevoir des équipements : usage concurrent probable."
      a_confirmer: true
      question_expert: "Le suffixe 'e' est aussi parfois 'espace' ou 'écologique' selon les communes : garder la regex ou ne se fier qu'au libellé long ?"
    - id: sect_activites
      label: "Sous-secteur d'activités économiques"
      types: [A, N]
      libelle_regex: '^[AN](x|y|act|ae|ia)\d*$'
      mots_cles: ['activites? (economiques?|artisanales?|industrielles?|commerciales?)', 'artisanat', 'industriel', "zone d.activites?"]
      effets: {perennite: -25}
      justification: "Activités économiques admises en zone A/N (STECAL de fait)."
    - id: sect_carriere
      label: "Sous-secteur carrière / extraction"
      types: [A, N]
      libelle_regex: '^N(ca|car|carr|k)\d*$'
      mots_cles: ['carriere', 'extraction', 'gravier', 'granulat', 'exploitation du sous-sol', 'sabliere']
      effets: {perennite: -30}
      point_a_verifier: "Carrière : vérifier l'échéance de l'autorisation (ICPE) et l'arrêté de remise en état — une carrière en fin d'exploitation peut devenir une opportunité de création de milieux."
      justification: "Exploitation du sous-sol en cours ou autorisable : incompatibilité à court terme, opportunité à terme."
    - id: sect_energie
      label: "Sous-secteur énergies renouvelables (photovoltaïque, éolien)"
      types: [A, N]
      libelle_regex: '(pv|enr|phv|solaire|eol)'
      mots_cles: ['photovolta', 'solaire', 'energies? renouvelables?', 'eolien', 'agrivolta', 'methanis']
      effets: {perennite: -35}
      veto: [{seuil_pct: 50, niveau: majeur, motif: "Secteur dédié aux énergies renouvelables : concurrence foncière directe."}]
      justification: "Concurrence directe des développeurs ENR sur le foncier, à loyers sans commune mesure avec l'agricole."
    - id: sect_habitat_diffus
      label: "Sous-secteur habitat diffus / STECAL"
      types: [A, N]
      libelle_regex: '^[AN](h|d|hd|ha)\d*[a-z]?$'
      mots_cles: ['habitat (diffus|existant)', 'hameaux?', '\bstecal\b', 'taille et (de )?capacite', 'bati existant']
      effets: {perennite: -20}
      justification: "Constructions admises (habitat diffus, extensions)."
    - id: sect_jardins
      label: "Sous-secteur jardins"
      types: [N, U]
      libelle_regex: '^Nj\d*$'
      mots_cles: ['jardins?']
      effets: {perennite: -5}
      justification: "Usage jardiné, fragmentation foncière, abris de jardin admis."
    - id: sect_agricole_protege
      label: "Sous-secteur agricole protégé / inconstructible"
      types: [A]
      libelle_regex: '^A(p|pr|inc|0|s)\d*$'
      mots_cles: ['agricoles? protegee?s?', 'agricole inconstructible', 'interet paysager', 'protection paysagere', 'agricole stricte?']
      effets: {perennite: 10}
      justification: "Même les bâtiments agricoles y sont interdits ou très limités : pérennité renforcée."
    - id: sect_risque
      label: "Sous-secteur soumis à un risque (inondation...)"
      types: [A, N]
      libelle_regex: '^[AN][a-z]*(i|ri|inond)\d*$'
      mots_cles: ['inondable', 'inondation', 'submersion', '\bppri\b', '\bcrues?\b']
      effets: {perennite: 8}
      profils: {zones_humides: {perennite: 8, synergie: 8}}
      point_a_verifier: "Secteur à risque : remblais et exhaussements généralement interdits ; le creusement (mares, reprofilage) et la plantation peuvent être réglementés dans les zones d'écoulement — lire le règlement du PPR."
      justification: "Inconstructibilité de fait (pérennité). Une zone inondable est cohérente avec une restauration de zone humide ou de champ d'expansion de crue."
      a_confirmer: true
      question_expert: "Suffixe 'i' (Ai, Ni) : assez fiable pour 'inondable' ?"
    - id: sect_infrastructures
      label: "Sous-secteur infrastructures (aéroport, militaire, ferroviaire, autoroute)"
      types: [A, N]
      libelle_regex: '^[AN](aer|aero|mil|fer|ferro)\d*$'
      mots_cles: ['aeroport', 'aerodrome', 'militaire', 'defense nationale', 'ferroviaire', 'autoroute']
      effets: {perennite: -15}
      profils: {zones_humides: {perennite: -15, synergie: -8}}
      point_a_verifier: "Proximité d'infrastructure : près d'un aérodrome, la création de plans d'eau attractifs pour l'avifaune est encadrée (péril animalier)."
      justification: "Emprise ou abords d'infrastructure : usage concurrent, nuisances."
    - id: sect_littoral_remarquable
      label: "Sous-secteur espace remarquable (littoral / montagne)"
      types: [N, A]
      libelle_regex: '^N(rl|lr)\d*$'
      mots_cles: ['espaces? remarquables?', 'l\.? ?121-23', 'l\.? ?146-6']
      effets: {perennite: 12, synergie: -5, compatibilite: -5}
      point_a_verifier: "Espace remarquable : seuls des aménagements légers sont admis (R121-5) ; additionnalité à démontrer."
      justification: "Protection maximale au titre de la loi Littoral : très pérenne, mais travaux limités et additionnalité discutable."
      a_confirmer: true
      question_expert: "Le suffixe 'Nl' désigne tantôt le littoral, tantôt les loisirs : faut-il exiger le libellé long ?"
    - id: sect_agricole_constructible
      label: "Sous-secteur agricole constructible / élevage"
      types: [A]
      libelle_regex: '^A(c|b|e?l?v|elev)\d*$'
      mots_cles: ['agricole constructible', 'secteur constructible', "batiments? d.elevage"]
      effets: {perennite: -8}
      justification: "Secteur où les bâtiments agricoles sont spécifiquement admis."
      a_confirmer: true
      question_expert: "'Ac' est parfois 'agricole constructible', parfois 'agricole carrière' : à confirmer."
    - id: sect_dechets
      label: "Sous-secteur déchets / stockage"
      types: [A, N]
      libelle_regex: '^N(isdi|dec|dech)\d*$'
      mots_cles: ['dechets?', '\bisdi\b', 'decharge', 'enfouissement']
      effets: {perennite: -25}
      justification: "Activité de stockage ou traitement de déchets."
    - id: sect_renaturation
      label: "Secteur de renaturation / friche"
      types: [U, A, N, AUc, AUs]
      mots_cles: ['renaturation', 'desartificialis', 'friche', 'desimpermeabilis']
      effets: {synergie: 15}
      point_a_verifier: "Secteur de renaturation / friche : candidat à une compensation par désartificialisation (vérifier l'additionnalité vis-à-vis des engagements ZAN de la collectivité)."
      justification: "La collectivité identifie un besoin de renaturation : synergie forte."

# -----------------------------------------------------------------------------
# VOISINAGE (anneau autour de la cible, cf. synthese.anneau_zonage)
# -----------------------------------------------------------------------------
voisinage:
  pression_urbaine:
    # pression = %U + %AUc + %CC constructible + 0.6 x %AUs (dans l'anneau)
    coef_AUs: 0.6
    points_par_pct: -0.25
    plafond: -20
    justification: "Un front d'urbanisation proche augmente le risque de pression foncière, de fragmentation et de conflits d'usage sur 30 ans."
  continuite_naturelle:
    # continuité = %N + 0.5 x %A (dans l'anneau)
    coef_A: 0.5
    points_par_pct: 0.15
    plafond: 10
    justification: "Une parcelle entourée de zones naturelles s'insère dans une continuité : meilleure fonctionnalité écologique de la mesure."

# -----------------------------------------------------------------------------
# RÈGLES : prescriptions, informations, servitudes, mots-clés
# L'ordre compte pour la détection par mots-clés : du plus spécifique au plus général.
# -----------------------------------------------------------------------------
regles:

  # ============================ PRESCRIPTIONS ===============================

  - id: psc_ebc_creer
    label: "EBC à créer"
    familles: [prescription]
    codes: ["01-02"]
    groupe: boisement_protege
    mots_cles: ['(ebc|espaces? boises? classes?) a creer', 'boisements? a creer']
    effets: {perennite: 12, compatibilite: -5}
    profils:
      boisement: {perennite: 12, synergie: 15, compatibilite: 5}
      zones_humides: {perennite: 12, compatibilite: -40}
      milieux_ouverts: {perennite: 12, compatibilite: -40}
    veto: [{seuil_pct: 50, niveau: bloquant, profils: [zones_humides, milieux_ouverts], motif: "EBC à créer : obligation de boisement contradictoire avec une mesure de milieux ouverts ou humides."}]
    justification: "L113-1 : obligation de créer un boisement. Synergie directe pour un boisement compensatoire, contradiction pour les autres mesures."
    references: ["L113-1", "R151-31 1°"]

  - id: psc_ebc_littoral
    label: "EBC significatif loi Littoral"
    familles: [prescription]
    codes: ["01-03"]
    groupe: boisement_protege
    mots_cles: ['boises? significatifs?', 'l\.? ?121-27']
    effets: {perennite: 20, compatibilite: -10, synergie: -5}
    profils:
      zones_humides: {perennite: 20, compatibilite: -45, synergie: -5}
      milieux_ouverts: {perennite: 20, compatibilite: -45, synergie: -5}
      boisement: {perennite: 20, synergie: -10}
    veto: [{seuil_pct: 50, niveau: bloquant, profils: [zones_humides, milieux_ouverts], motif: "EBC significatif : défrichement irrecevable."}]
    justification: "Régime EBC renforcé par la loi Littoral. Boisement existant déjà protégé : additionnalité faible pour un boisement."
    references: ["L121-27", "L113-1"]

  - id: psc_ebc
    label: "Espace boisé classé"
    familles: [prescription]
    codes: ["01-00", "01-01"]
    groupe: boisement_protege
    mots_cles: ['espaces? boises? classes?', '\bebc\b', 'l\.? ?113-1\b', 'l\.? ?130-1']
    effets: {perennite: 15, compatibilite: -15}
    profils:
      zones_humides: {perennite: 15, compatibilite: -45}
      milieux_ouverts: {perennite: 15, compatibilite: -45}
      boisement: {perennite: 15, compatibilite: 0, synergie: -8}
    veto:
      - {seuil_pct: 50, niveau: bloquant, profils: [zones_humides, milieux_ouverts], motif: "EBC : défrichement irrecevable et changement d'occupation compromettant les boisements interdit (L113-2)."}
